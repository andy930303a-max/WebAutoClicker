name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Files
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/java/com/example/webautoclicker", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          open("settings.gradle.kts","w").write("pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name=\"WebAutoClicker\"\ninclude(\":app\")\n")
          open("build.gradle.kts","w").write("plugins{id(\"com.android.application\") version \"8.2.2\" apply false;id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false}\n")
          open("app/build.gradle.kts","w").write("plugins{id(\"com.android.application\");id(\"org.jetbrains.kotlin.android\")}\nandroid{namespace=\"com.example.webautoclicker\";compileSdk=34;defaultConfig{applicationId=\"com.example.webautoclicker\";minSdk=24;targetSdk=34;versionCode=1;versionName=\"1.0\"};compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17};kotlinOptions{jvmTarget=\"17\"}}\ndependencies{implementation(\"androidx.core:core-ktx:1.12.0\");implementation(\"androidx.appcompat:appcompat:1.6.1\");implementation(\"com.google.android.material:material:1.11.0\");implementation(\"org.opencv:opencv:4.9.0\")}\n")
          open("app/src/main/AndroidManifest.xml","w").write("<manifest xmlns:android=\"http://android.com\"><uses-permission android:name=\"android.permission.INTERNET\"/><application android:label=\"網頁自動點擊器\" android:theme=\"@style/Theme.MaterialComponents.DayNight.NoActionBar\" android:usesCleartextTraffic=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>")
          '
      - name: Create UI and Code
        run: |
          python3 -c '
          open("app/src/main/res/layout/activity_main.xml","w").write("""<LinearLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="12dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><EditText android:id="@+id/etUrl" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="https://"/><Button android:id="@+id/btnLoadUrl" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="前往"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><Button android:id="@+id/btnSelectImg" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="選圖"/><ImageView android:id="@+id/ivTargetPreview" android:layout_width="40dp" android:layout_height="40dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="相似度:"/><EditText android:id="@+id/etConfidence" android:layout_width="55dp" android:layout_height="wrap_content" android:text="0.85"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><RadioGroup android:id="@+id/rgMode" android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal"><RadioButton android:id="@+id/rbOnce" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true" android:text="點一次"/><RadioButton android:id="@+id/rbLoop" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="連點"/></RadioGroup><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="冷卻:"/><EditText android:id="@+id/etDelay" android:layout_width="50dp" android:layout_height="wrap_content" android:text="0.5"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/tvStatus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="待機中"/><Button android:id="@+id/btnStart" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="開始"/><Button android:id="@+id/btnStop" android:layout_width="wrap_content" android:layout_height="wrap_content" android:enabled="false" android:text="停止"/></LinearLayout><WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/></LinearLayout>""")
          code = """package com.example.webautoclicker
          import android.annotation.SuppressLint
          import android.graphics.*
          import android.net.Uri
          import android.os.*
          import android.webkit.*
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.opencv.android.*
          import org.opencv.core.*
          import org.opencv.imgproc.Imgproc
          import java.util.concurrent.*
          import java.util.concurrent.atomic.AtomicBoolean
          class MainActivity : AppCompatActivity() {
              private var targetBitmap: Bitmap? = null
              private val isRunning = AtomicBoolean(false)
              private val mainHandler = Handler(Looper.getMainLooper())
              private val executor = Executors.newSingleThreadExecutor()
              private lateinit var webView: WebView
              private lateinit var tvStatus: TextView
              private lateinit var btnStart: Button
              private lateinit var btnStop: Button
              private val pickImg = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let {
                      val bmp = BitmapFactory.decodeStream(contentResolver.openInputStream(it))
                      if (bmp != null && bmp.width >= 5) { targetBitmap = bmp; findViewById<ImageView>(R.id.ivTargetPreview).setImageBitmap(bmp); tvStatus.text = "已載入圖片" }
                  }
              }
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  OpenCVLoader.initLocal()
                  webView = findViewById(R.id.webView); tvStatus = findViewById(R.id.tvStatus); btnStart = findViewById(R.id.btnStart); btnStop = findViewById(R.id.btnStop)
                  webView.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; useWideViewPort = true; loadWithOverviewMode = true }
                  webView.webViewClient = WebViewClient()
                  findViewById<Button>(R.id.btnLoadUrl).setOnClickListener { val u = findViewById<EditText>(R.id.etUrl).text.toString().trim(); if (u.startsWith("http")) webView.loadUrl(u) }
                  findViewById<Button>(R.id.btnSelectImg).setOnClickListener { pickImg.launch("image/*") }
                  btnStart.setOnClickListener {
                      val t = targetBitmap ?: return@setOnClickListener
                      val c = findViewById<EditText>(R.id.etConfidence).text.toString().toDoubleOrNull() ?: 0.85
                      val d = ((findViewById<EditText>(R.id.etDelay).text.toString().toDoubleOrNull() ?: 0.5) * 1000).toLong()
                      val once = findViewById<RadioGroup>(R.id.rgMode).checkedRadioButtonId == R.id.rbOnce
                      isRunning.set(true); btnStart.isEnabled = false; btnStop.isEnabled = true; tvStatus.text = "偵測中..."
                      executor.execute {
                          var was = false; var cnt = 0
                          while (isRunning.get()) {
                              var scr: Bitmap? = null; val l = CountDownLatch(1)
                              mainHandler.post { if (webView.width > 0) { scr = Bitmap.createBitmap(webView.width, webView.height, Bitmap.Config.ARGB_8888); webView.draw(Canvas(scr!!)) }; l.countDown() }
                              l.await()
                              val s = scr ?: continue
                              val sM = Mat(); val tM = Mat(); val rM = Mat()
                              Utils.bitmapToMat(s, sM); Utils.bitmapToMat(t, tM); s.recycle()
                              Imgproc.cvtColor(sM, sM, Imgproc.COLOR_RGBA2GRAY); Imgproc.cvtColor(tM, tM, Imgproc.COLOR_RGBA2GRAY)
                              Imgproc.matchTemplate(sM, tM, rM, Imgproc.TM_CCOEFF_NORMED)
                              val mmr = Core.minMaxLoc(rM); sM.release(); tM.release(); rM.release()
                              if (mmr.maxVal >= c) {
                                  if (once && was) { Thread.sleep(50); continue }
                                  was = true; cnt++
                                  val den = resources.displayMetrics.density
                                  val cx = ((mmr.maxLoc.x + t.width / 2.0) / den).toInt(); val cy = ((mmr.maxLoc.y + t.height / 2.0) / den).toInt()
                                  mainHandler.post { webView.evaluateJavascript("(function(){var e=document.elementFromPoint($cx,$cy);if(e)e.click();})();", null); tvStatus.text = "已點擊 $cnt 次" }
                                  if (d > 0) Thread.sleep(d)
                              } else { was = false; Thread.sleep(50) }
                          }
                      }
                  }
                  btnStop.setOnClickListener { isRunning.set(false); btnStart.isEnabled = true; btnStop.isEnabled = false; tvStatus.text = "已停止" }
              }
          }"""
          open("app/src/main/java/com/example/webautoclicker/MainActivity.kt","w").write("\n".join(line.strip() for line in code.splitlines()))
          '
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WebAutoClicker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
